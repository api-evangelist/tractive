name: Tractive
description: >-
  Tractive is an Austrian pet-technology company, founded in October 2012 in
  Pasching, Austria and led by CEO Michael Hurnaus, that builds GPS location and
  health-monitoring trackers for dogs and cats. Its collar-attached devices
  (such as the DOG and CAT GPS trackers) pair with a subscription mobile app to
  deliver real-time worldwide location, virtual fences, activity, sleep and, more
  recently, resting heart-rate and respiratory-rate health intelligence to more
  than 1.4 million active subscribers. Tractive was acquired by Italy's Bending
  Spoons in 2026. Tractive does NOT publish a public developer API, SDK, or
  developer portal — its backend HTTP API (api.tractive.com) is private to its
  own apps; the only clients are unofficial, community reverse-engineered
  libraries. This profile enriches the company's identity for the API Evangelist
  network; there is no official API surface to catalog.
